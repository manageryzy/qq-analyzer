[package]
name = "msg3_richtext_parser_rs"
version = "0.1.0"
edition = "2021"
license = "WTFPL"
description = "Local Rust analyzer for PC QQ Msg3 chat logs"

[features]
default = ["encoding_rs", "web-ui"]
encoding_rs = ["dep:encoding_rs"]
image-index = ["dep:image", "dep:sha2", "dep:zune-jpeg", "dep:crossbeam-channel"]
image-index-qdrant = ["image-index", "dep:qdrant-common", "dep:qdrant-segment", "dep:rand"]
web-ui = ["dep:rust-embed"]
image-index-clip = ["image-index", "dep:half", "dep:open_clip_inference", "dep:ort", "open_clip_inference/half_io", "ort/half"]
image-index-clip-cuda = ["image-index-clip", "open_clip_inference/cuda", "ort/cuda"]
image-index-clip-directml = ["image-index-clip", "open_clip_inference/directml", "ort/directml"]
image-index-clip-tensorrt = ["image-index-clip", "open_clip_inference/tensorrt", "ort/tensorrt"]
image-index-sscd = ["image-index", "fast_image_resize", "dep:half", "dep:ndarray", "dep:ort", "ort/half"]
image-index-sscd-cuda = ["image-index-sscd", "ort/cuda"]
image-index-sscd-directml = ["image-index-sscd", "ort/directml"]
image-index-sscd-tensorrt = ["image-index-sscd", "ort/tensorrt"]
fast_image_resize = ["dep:fast_image_resize"]
media-info = [
    "dep:infer",
    "dep:mp4parse",
    "dep:matroska",
    "dep:lofty",
    "dep:nom-exif",
    "dep:bitstream-io",
    "dep:byteorder",
    "dep:sha2",
    "dep:crossbeam-channel",
]

[dependencies]
anyhow = "1"
encoding_rs = { version = "0.8", optional = true }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1"
md5 = "0.7"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
axum = { version = "0.8", features = ["multipart"] }
httpdate = "1"
rust-embed = { version = "8", optional = true }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
urlencoding = "2"
xz2 = "0.1"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"], optional = true }
zune-jpeg = { version = "0.5.15", optional = true }
infer = { version = "0.19", optional = true }
mp4parse = { version = "0.17", optional = true }
matroska = { version = "0.30", optional = true }
lofty = { version = "0.24", optional = true }
nom-exif = { version = "3.6", optional = true }
bitstream-io = { version = "4.10", optional = true }
byteorder = { version = "1.5", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
open_clip_inference = { version = "0.4", default-features = false, features = ["download-binaries", "copy-dylibs", "fast_image_resize"], optional = true }
ort = { version = "2.0.0-rc.12", features = ["ndarray"], optional = true }
ndarray = { version = "0.17", optional = true }
fast_image_resize = { version = "6.0.0", optional = true }
half = { version = "2.1", default-features = false, optional = true }
qdrant-common = { package = "common", path = "../vendor/qdrant/lib/common/common", optional = true }
qdrant-segment = { package = "segment", path = "../vendor/qdrant/lib/segment", optional = true }
rand = { version = "0.9", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[[bin]]
name = "msg3_richtext_parser_rs"
path = "src/main.rs"

[[bin]]
name = "msg3_log_service_rs"
path = "src/bin/msg3_log_service_rs.rs"

[[bin]]
name = "info_storage_probe"
path = "src/bin/info_storage_probe.rs"

[[bin]]
name = "group_avatar_probe"
path = "src/bin/group_avatar_probe.rs"

[[bin]]
name = "cache_name_probe"
path = "src/bin/cache_name_probe.rs"

[[bin]]
name = "info_storage_field_scan"
path = "src/bin/info_storage_field_scan.rs"

[[bin]]
name = "file_index_probe"
path = "src/bin/file_index_probe.rs"

[[bin]]
name = "parser_group_selftest"
path = "src/bin/parser_group_selftest.rs"

[[bin]]
name = "parser_all_sample_selftest"
path = "src/bin/parser_all_sample_selftest.rs"

[[bin]]
name = "parser_coverage_check"
path = "src/bin/parser_coverage_check.rs"

[[bin]]
name = "msg3_info_parse"
path = "src/bin/msg3_info_parse.rs"

[[bin]]
name = "qq_analyzer_rs"
path = "src/bin/qq_analyzer_rs.rs"

[[bin]]
name = "ioring_probe"
path = "src/bin/ioring_probe.rs"
